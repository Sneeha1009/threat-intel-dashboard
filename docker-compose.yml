services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: threatintel, POSTGRES_USER: threatintel, POSTGRES_PASSWORD: threatintel }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U threatintel -d threatintel"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: ./backend
    environment: { DATABASE_URL: postgresql+psycopg://threatintel:threatintel@postgres:5432/threatintel, REDIS_URL: redis://redis:6379/0, CORS_ORIGINS: http://localhost:5173 }
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: ./backend
    command: celery -A worker.celery_app worker --beat --loglevel=INFO
    environment: { REDIS_URL: redis://redis:6379/0 }
    depends_on: { redis: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes: { postgres_data: }
