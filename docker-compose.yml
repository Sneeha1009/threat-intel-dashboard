services:

  postgres:
    image: postgres:16
    container_name: threatintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threatintel
      POSTGRES_PASSWORD: threatintel_password
      POSTGRES_DB: threatintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: threatintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: